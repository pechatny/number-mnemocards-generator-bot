spring:
  profiles:
    active: ${ENVIRONMENT_PROFILE_NAME:dev}
  jpa:
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}
    contexts: prod,dev
bot:
  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    name: NumberMnemocardsGeneratorBot
    token: ${BOT_TOKEN:}
    payments-enabled: true
  max:
    enabled: ${MAX_BOT_ENABLED:true}
    token: ${MAX_BOT_TOKEN:}
    payments-enabled: false
    polling:
      timeout-seconds: 30
      limit: 100
# Автоконфигурация telegrambots-spring-boot-starter поднимается только вместе с Telegram-ботом
telegrambots:
  enabled: ${bot.telegram.enabled}
payment:
  token: ${PAYMENT_TOKEN:}